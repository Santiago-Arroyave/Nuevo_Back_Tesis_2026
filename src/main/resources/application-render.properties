spring.application.name=Goblink_Park
server.port=${PORT:8080}

# =====================================================
# JWT
# =====================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# DATABASE - Conexión directa a Supabase
# =====================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================================================
# MULTIPART CONFIGURATION (Carga de fotos)
# =====================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB

# =====================================================
# SUPABASE STORAGE
# =====================================================
supabase.url=${SUPABASE_URL:https://znkoxmkxkimteknuacya.supabase.co}
supabase.key=${SUPABASE_KEY:PEGA_AQUI_TU_LLAVE_COPIADA_DE_SUPABASE}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:goblin-media}

# =====================================================
# HIKARI CONNECTION POOL LIMITS (Evitar EMAXCONNSESSION)
# =====================================================
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
